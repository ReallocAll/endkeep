[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "endstone-endkeep"
dynamic = ["version"]
dependencies = [
    "endstone>=0.11,<0.12",
    "amulet-leveldb==3.0.7a0",
    "zstandard>=0.23,<1",
    "tomlkit>=0.13,<1",
]
authors = [
    { name = "ReallocAll" },
]
description = "Crash-safe logical incremental world backups for Endstone"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "minecraft", "bedrock", "backup", "leveldb"]
requires-python = ">=3.12,<3.15"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=8.4,<9",
    "ruff>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endkeep"
Documentation = "https://github.com/ReallocAll/endkeep#readme"
Changelog = "https://github.com/ReallocAll/endkeep/blob/main/CHANGELOG.md"
Issues = "https://github.com/ReallocAll/endkeep/issues"

[project.scripts]
endkeep = "endstone_endkeep.offline.cli:main"

[project.entry-points."endstone"]
endkeep = "endstone_endkeep:EndKeepPlugin"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/endstone_endkeep/_version.py"]

[tool.ruff.lint]
select = ["I", "E", "F", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/endstone_endkeep/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_endkeep"]

name: Feature Request
description: Propose a change to EndKeep
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and data-safety impact
      description: Explain the use case and implications for retained recovery points.

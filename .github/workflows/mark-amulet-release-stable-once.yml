name: Mark Amulet compatibility Release stable (one-time)

on:
  push:
    branches:
      - release/amulet-leveldb-compat-cp312-cp313
    paths:
      - .github/workflows/mark-amulet-release-stable-once.yml

permissions:
  contents: write

jobs:
  update-existing-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify identity and change prerelease flag only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: "408225849"
          TAG: "amulet-leveldb-3.0.7a0-compat-cp312-cp313"
        shell: bash
        run: |
          set -euo pipefail
          API="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          before="$(gh api "$API" --jq '.tag_name + " " + (.prerelease|tostring) + " " + (.draft|tostring)')"
          echo "Before: $before"
          test "$before" = "$TAG true false"
          gh api --method PATCH "$API" -F prerelease=false --jq '{tag: .tag_name, prerelease: .prerelease, draft: .draft, assets: (.assets | length), url: .html_url}'
          after="$(gh api "$API" --jq '.tag_name + " " + (.prerelease|tostring) + " " + (.draft|tostring)')"
          echo "After: $after"
          test "$after" = "$TAG false false"
          test "$(gh api "$API" --jq '.assets|length')" = "7"

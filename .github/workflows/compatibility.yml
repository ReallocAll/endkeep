name: Python and Windows compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: ubuntu-24.04, python: '3.14' }
          - { os: ubuntu-24.04, python: '3.15' }
          - { os: windows-2025, python: '3.12' }
          - { os: windows-2025, python: '3.13' }
          - { os: windows-2025, python: '3.14' }
          - { os: windows-2025, python: '3.15' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact EndKeep source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install selected interpreter
        run: |
          uv python install '${{ matrix.python }}'
          uv venv .venv --python '${{ matrix.python }}'
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo 'PYTHON=.venv/Scripts/python.exe' >> "$GITHUB_ENV"
          else
            echo 'PYTHON=.venv/bin/python' >> "$GITHUB_ENV"
          fi

      - name: Download compatible experimental Endstone for Python 3.15
        if: matrix.python == '3.15'
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT || github.token }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            WHEEL='endstone-0.11.14.dev6-cp315-cp315-win_amd64.whl'
          else
            WHEEL='endstone-0.11.14.dev6-cp315-cp315-manylinux_2_31_x86_64.whl'
          fi
          mkdir -p endstone-artifact
          gh run download 38045137884 --repo EndstoneMC/endstone --name "$WHEEL" --dir endstone-artifact
          ENDSTONE_WHEEL="$WHEEL" python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path("endstone-artifact")
          target = root / os.environ["ENDSTONE_WHEEL"]
          members = sorted(p for p in root.rglob("*") if p.is_file() and p != target)
          assert any(".dist-info/" in p.as_posix() for p in members)
          with ZipFile(target, "w", compression=ZIP_DEFLATED, compresslevel=1) as wheel:
              for path in members:
                  wheel.write(path, path.relative_to(root).as_posix())
          with ZipFile(target) as wheel:
              assert wheel.testzip() is None
          PY
          echo "ENDSTONE_WHEEL=endstone-artifact/$WHEEL" >> "$GITHUB_ENV"

      - name: Install pinned compatibility dependencies
        run: |
          if [[ "${{ matrix.python }}" == "3.15" ]]; then
            uv pip install --python "$PYTHON" "$ENDSTONE_WHEEL"
          fi
          uv pip install --python "$PYTHON" -e '.[dev]'
          uv pip check --python "$PYTHON"
          "$PYTHON" - <<'PY'
          from importlib.metadata import version
          from amulet.leveldb import LevelDB
          assert version("amulet-leveldb").split("+")[0] == "3.0.8a1"
          assert version("amulet-utils").split("+")[0] == "1.1.8a0"
          print("Amulet-LevelDB:", version("amulet-leveldb"))
          print("Amulet-Utils:", version("amulet-utils"))
          print("Endstone:", version("endstone"))
          PY

      - name: Run regression suite
        run: '"$PYTHON" -m pytest -q'

name: Python and Windows compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Provision Python
        run: |
          uv python install '${{ matrix.python }}'
          uv venv .venv --python '${{ matrix.python }}'
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "PYTHON=.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "PYTHON=.venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Download exact Endstone CPython 3.15 Wheel
        if: matrix.python == '3.15'
        uses: actions/download-artifact@v8
        with:
          repository: EndstoneMC/endstone
          run-id: 38045137884
          github-token: ${{ github.token }}
          pattern: endstone-*-cp315-cp315-*.whl
          path: endstone-dist
          merge-multiple: true
          skip-decompress: true
      - name: Clean install from maintained SHA256-pinned Wheels
        run: |
          if [[ '${{ matrix.python }}' == '3.15' ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              ENDSTONE_WHEEL="$(find endstone-dist -name '*cp315*win_amd64.whl' -print -quit)"
            else
              ENDSTONE_WHEEL="$(find endstone-dist -name '*cp315*manylinux*.whl' -print -quit)"
            fi
            uv pip install --python "$PYTHON" "$ENDSTONE_WHEEL"
          fi
          uv pip install --python "$PYTHON" -e '.[dev]'
          uv pip check --python "$PYTHON"
          "$PYTHON" .github/scripts/amulet_leveldb_smoke.py
          "$PYTHON" -m pytest
      - name: Build packaged plugin
        run: uv build --wheel


name: Amulet-LevelDB 3.0.7a0 CPython 3.11-3.14 experiment

on:
  push:
    branches:
      - experiment/amulet-leveldb-cp311-cp314
    paths:
      - .github/workflows/amulet-leveldb-backport.yml
      - .github/scripts/amulet_leveldb_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wheels:
    name: manylinux x86-64 / ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.11', tag: 'cp311', wheel: 'cp311-manylinux_x86_64' }
          - { python: '3.12', tag: 'cp312', wheel: 'cp312-manylinux_x86_64' }
          - { python: '3.13', tag: 'cp313', wheel: 'cp313-manylinux_x86_64' }
          - { python: '3.14', tag: 'cp314', wheel: 'cp314-manylinux_x86_64' }

    steps:
      - name: Checkout experimental harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Amulet-LevelDB 3.0.7a0 source
        uses: actions/checkout@v4
        with:
          repository: Amulet-Team/Amulet-LevelDB
          ref: 736228e375e9f535b6522bd28168fc306a5354b9
          path: amulet-src
          fetch-depth: 0
          persist-credentials: false

      - name: Verify upstream provenance and patch only Python floor
        run: |
          set -euo pipefail
          test "$(git -C amulet-src rev-parse HEAD)" = 736228e375e9f535b6522bd28168fc306a5354b9
          test "$(git -C amulet-src describe --tags --exact-match)" = 3.0.7a0
          python - <<'PY'
          from pathlib import Path
          project = Path('amulet-src/pyproject.toml')
          text = project.read_text(encoding='utf-8')
          before = 'requires-python = ">=3.14"'
          assert text.count(before) == 1, 'unexpected upstream metadata; stop instead of guessing'
          project.write_text(text.replace(before, 'requires-python = ">=3.11"'), encoding='utf-8')
          PY
          cp .github/scripts/amulet_leveldb_smoke.py amulet-src/tests/test_backport_smoke.py
          git -C amulet-src diff --check
          git -C amulet-src diff -- pyproject.toml

      - name: Set up build frontend
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel~=4.1'

      - name: Build and run smoke test inside manylinux
        env:
          CIBW_BEFORE_BUILD: 'python -m pip install "cmake>=4.1,<5"'
          CIBW_BEFORE_TEST: 'python -m pip install "cmake>=4.1,<5"'
          CIBW_TEST_COMMAND: 'python {project}/tests/test_backport_smoke.py && python {project}/tests/test_db.py'
          CIBW_TEST_SOURCES: 'tests'
        run: |
          set -euo pipefail
          mkdir -p dist
          cd amulet-src
          python -m cibuildwheel --only '${{ matrix.wheel }}' --output-dir ../dist .

      - name: Validate Wheel metadata and tags
        env:
          TARGET_TAG: ${{ matrix.tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          target_tag = os.environ['TARGET_TAG']
          wheels = list(Path('dist').glob('amulet_leveldb-3.0.7a0*-*.whl'))
          assert len(wheels) == 1, f'expected exactly one 3.0.7a0 wheel, got {wheels}'
          path = wheels[0]
          assert f'-{target_tag}-{target_tag}-manylinux_' in path.name, path.name
          with ZipFile(path) as z:
              metadata_file = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
              metadata = z.read(metadata_file).decode()
          assert 'Requires-Python: >=3.11' in metadata, metadata
          print('Validated:', path, 'size:', path.stat().st_size)
          PY

      - name: Upload experimental Wheel (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: amulet-leveldb-3.0.7a0-${{ matrix.tag }}-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish-four-wheels:
    name: Publish selectable backport wheels
    needs: linux-wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all four independently tested Wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: amulet-leveldb-3.0.7a0-cp*-linux-x86_64
          merge-multiple: true
          path: dist

      - name: Confirm four distinct CPython ABI wheels and checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          tags = ('cp311', 'cp312', 'cp313', 'cp314')
          wheels = sorted(Path('dist').glob('*.whl'))
          assert len(wheels) == len(tags), [x.name for x in wheels]
          for tag in tags:
              matches = [p for p in wheels if f'-{tag}-{tag}-manylinux_' in p.name]
              assert len(matches) == 1, (tag, [x.name for x in wheels])
              with ZipFile(matches[0]) as archive:
                  meta = next(x for x in archive.namelist() if x.endswith('.dist-info/METADATA'))
                  data = archive.read(meta).decode('utf-8')
                  assert 'Requires-Python: >=3.11' in data
                  assert 'Name: amulet-leveldb' in data
                  assert 'Version: 3.0.7a0+0.g736228e.dirty' in data
                  assert any(x.endswith('.dist-info/licenses/LICENSE') for x in archive.namelist())
          checksum = ''.join(
              f'{sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in wheels
          )
          (Path('dist') / 'SHA256SUMS').write_text(checksum)
          print(checksum)
          PY

      - name: Create dedicated prerelease with individually downloadable wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: amulet-leveldb-3.0.7a0-backport-cp311-cp314
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; keeping published binaries unchanged."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Amulet-LevelDB 3.0.7a0 backport (CPython 3.11–3.14, Linux x86-64)" \
            --notes-file .github/amulet-leveldb-backport-release.md
